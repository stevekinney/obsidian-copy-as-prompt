name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      # The bundle is what actually ships, so assert on the bundle rather than
      # on the source: it must be CommonJS (Obsidian's loader requires it) and
      # must leave `obsidian` external instead of inlining a second copy.
      - name: Check the bundle's shape
        run: |
          test -f main.js || { echo "main.js was not produced"; exit 1; }
          grep -q 'require("obsidian")' main.js || { echo "obsidian is not external"; exit 1; }
          grep -q 'module.exports' main.js || { echo "bundle is not CommonJS"; exit 1; }
