name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Includes verify:bundle, which asserts on the built main.js rather than
      # on src/ — CommonJS, obsidian external, and no static Node or Electron
      # require that would break the plugin on mobile.
      - name: Validate
        run: bun run validate
