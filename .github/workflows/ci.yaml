name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.3.13

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      # `validate` runs entirely under Bun. This step imports the emitted Node
      # bundle under the matrix Node version so the matrix is meaningful: it
      # catches Bun-only APIs leaking into src/ and ESM output Node cannot
      # load. It deliberately asserts nothing about the package's exports —
      # a smoke test naming a specific export breaks the moment you replace
      # the scaffold's placeholder API, which `verify:scaffold` tells you to
      # do. Add project-specific assertions here once you have real exports.
      - name: Smoke-test Node build
        run: node --input-type=module -e "await import('./dist/node/index.js');"
