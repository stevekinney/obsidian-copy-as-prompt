name: release

# Obsidian matches the release tag against manifest.json exactly, with no `v`
# prefix — `v1.0.0` produces a release nobody can install.
#
# The v-prefixed form is matched here anyway, on purpose. `bun pm version`
# creates tags that way, so excluding it means a mistaken tag triggers nothing
# at all and you are left wondering why. Matching it lets
# verify-release-version fail in the first step with an explanation instead.
# Use `bun run release <patch|minor|major>`, which tags correctly.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs first: a mismatch between the tag, manifest.json, and versions.json
      # is cheap to catch here and expensive to catch after publishing, since
      # re-releasing the same version is not possible.
      - name: Verify tag matches the manifest
        run: bun run verify:release-version

      - name: Validate
        run: bun run validate

      # Build provenance ties main.js to this workflow run and this commit. The
      # community directory looks for it, and it is the only thing that lets a
      # user check the bundle against the source.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      # These three filenames are what Obsidian downloads. `styles.css` is
      # optional in general but this plugin ships one, so all three go up.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
